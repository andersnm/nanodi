name: Test

on:
  push:
    branches: ['**']
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:dist
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: '*.tgz'

  test-express5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm i --no-save -w nanodi-express -w nanodi-express-test -w nanodi-express-demo express@5 @types/express@5
      - run: npm run build
      - run: npm run test:dist

  publish-core:
    needs: [build, test-express5]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # publish only on version tags
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - uses: actions/download-artifact@v4
        with:
          name: packages

      - run: npm publish nanodi-core-*.tgz --access public --provenance

  publish-express:
    needs: publish-core  # express depends on the core version published above
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # publish only on version tags
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - uses: actions/download-artifact@v4
        with:
          name: packages

      - run: npm publish nanodi-express-*.tgz --access public --provenance
